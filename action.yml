name: LooseEnd
description: Scan a codebase for security issues, AI slop and coding gaps.
author: LooseEnd
branding:
  icon: search
  color: blue

inputs:
  path:
    description: File or directory to scan.
    default: "."
  fail-on:
    description: Exit 1 if any finding is at or above this severity (critical, high, medium, low, info, none).
    default: "high"
  min-severity:
    description: Hide findings below this severity.
    default: ""
  category:
    description: Space-separated categories to run (security, slop, gap). Empty runs all.
    default: ""
  format:
    description: Report format (text, json, markdown, sarif).
    default: "text"
  output:
    description: Write the report to this file instead of stdout.
    default: ""
  baseline:
    description: JSON report or ID list whose findings are hidden.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install LooseEnd
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Scan
      shell: bash
      env:
        LE_PATH: ${{ inputs.path }}
        LE_FAIL_ON: ${{ inputs.fail-on }}
        LE_MIN_SEVERITY: ${{ inputs.min-severity }}
        LE_CATEGORY: ${{ inputs.category }}
        LE_FORMAT: ${{ inputs.format }}
        LE_OUTPUT: ${{ inputs.output }}
        LE_BASELINE: ${{ inputs.baseline }}
      run: |
        args=(scan "$LE_PATH" --fail-on "$LE_FAIL_ON" --format "$LE_FORMAT" --no-color)
        if [ -n "$LE_MIN_SEVERITY" ]; then args+=(--min-severity "$LE_MIN_SEVERITY"); fi
        if [ -n "$LE_OUTPUT" ]; then args+=(--output "$LE_OUTPUT"); fi
        if [ -n "$LE_BASELINE" ]; then args+=(--baseline "$LE_BASELINE"); fi
        for c in $LE_CATEGORY; do args+=(--category "$c"); done
        looseend "${args[@]}"